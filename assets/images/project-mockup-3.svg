<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <rect width="800" height="450" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <rect x="0" y="0" width="800" height="40" fill="#111111"/>
  <text x="30" y="25" fill="#ffffff" font-family="monospace" font-size="12">ARCH-DIAGRAM // MULTI-REGION KUBERNETES &amp; TERRAFORM MIGRATION</text>
  
  <!-- Cloud boxes -->
  <rect x="60" y="80" width="160" height="100" fill="#f9f9f9" stroke="#000000" stroke-width="1.5"/>
  <text x="80" y="115" font-family="monospace" font-weight="700" font-size="12">EDGE / CLOUDFLARE</text>
  <text x="80" y="135" font-family="sans-serif" font-size="10" fill="#666">Global CDN &amp; WAF</text>
  <text x="80" y="155" font-family="sans-serif" font-size="10" fill="#666">DDoS Protection</text>

  <!-- Line -->
  <line x1="220" y1="130" x2="300" y2="130" stroke="#000000" stroke-width="2" stroke-dasharray="4"/>

  <!-- Ingress -->
  <rect x="300" y="80" width="180" height="100" fill="#000000"/>
  <text x="320" y="115" font-family="monospace" font-weight="700" font-size="12" fill="#ffffff">API GATEWAY</text>
  <text x="320" y="135" font-family="sans-serif" font-size="10" fill="#aaaaaa">Rate Limiter / OAuth2</text>
  <text x="320" y="155" font-family="sans-serif" font-size="10" fill="#aaaaaa">Service Mesh Envoy</text>

  <!-- Line -->
  <line x1="480" y1="130" x2="560" y2="130" stroke="#000000" stroke-width="2"/>

  <!-- Microservices Cluster -->
  <rect x="560" y="70" width="180" height="320" fill="#f9f9f9" stroke="#000000" stroke-width="1.5"/>
  <text x="580" y="100" font-family="monospace" font-weight="700" font-size="12">K8S CLUSTER (EKS)</text>
  
  <rect x="580" y="120" width="140" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="590" y="145" font-family="sans-serif" font-size="11">Auth Service Pod</text>

  <rect x="580" y="180" width="140" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="590" y="205" font-family="sans-serif" font-size="11">Order Engine Pod</text>

  <rect x="580" y="240" width="140" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="590" y="265" font-family="sans-serif" font-size="11">Worker Queue Pod</text>

  <rect x="580" y="300" width="140" height="40" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="590" y="325" font-family="sans-serif" font-size="11">Analytics Pipeline</text>

  <!-- DB Box -->
  <rect x="260" y="250" width="220" height="140" fill="#f9f9f9" stroke="#000000" stroke-width="1.5"/>
  <text x="280" y="280" font-family="monospace" font-weight="700" font-size="12">PRIMARY / REPLICA DB</text>
  <text x="280" y="305" font-family="sans-serif" font-size="11" fill="#444">PostgreSQL Aurora Multi-AZ</text>
  <text x="280" y="330" font-family="sans-serif" font-size="11" fill="#444">Redis Cluster Cache</text>
  <text x="280" y="355" font-family="sans-serif" font-size="11" fill="#444">99.99% Guaranteed SLA</text>

  <line x1="560" y1="260" x2="480" y2="300" stroke="#000000" stroke-width="2"/>
</svg>