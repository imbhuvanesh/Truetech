<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <rect width="800" height="450" fill="#fcfcfc" stroke="#000000" stroke-width="2"/>
  <!-- Mobile Storefront Mockup -->
  <rect x="260" y="30" width="280" height="390" rx="20" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <!-- Screen Notch & Speaker -->
  <rect x="360" y="42" width="80" height="6" rx="3" fill="#000000"/>
  <!-- Header Bar -->
  <line x1="280" y1="70" x2="310" y2="70" stroke="#000000" stroke-width="2"/>
  <text x="360" y="74" font-family="sans-serif" font-weight="900" font-size="12" fill="#000000">NOVASTRIDE</text>
  <rect x="500" y="62" width="20" height="15" fill="#000000"/>
  <!-- Hero banner inside phone -->
  <rect x="280" y="90" width="240" height="110" fill="#111111"/>
  <text x="300" y="140" font-family="sans-serif" font-weight="800" font-size="14" fill="#ffffff">COLLECTION '25</text>
  <text x="300" y="160" font-family="sans-serif" font-weight="400" font-size="9" fill="#aaaaaa">Headless Shopify • 99 Lighthouse</text>
  <!-- Grid Items -->
  <rect x="280" y="220" width="112" height="120" fill="#f4f4f4" stroke="#000000" stroke-width="1"/>
  <rect x="408" y="220" width="112" height="120" fill="#f4f4f4" stroke="#000000" stroke-width="1"/>
  <line x1="290" y1="310" x2="360" y2="310" stroke="#000000" stroke-width="2"/>
  <line x1="418" y1="310" x2="488" y2="310" stroke="#000000" stroke-width="2"/>
  <!-- Checkout CTA inside phone -->
  <rect x="280" y="360" width="240" height="35" fill="#000000"/>
  <text x="360" y="382" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff">QUICK CHECKOUT</text>
</svg>